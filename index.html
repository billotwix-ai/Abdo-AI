<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDO TOP1 | Verified System</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', sans-serif; }
        canvas { position: absolute; top: 0; left: 0; z-index: -1; }

        .card {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff41;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            width: 320px;
            backdrop-filter: blur(10px);
        }

        /* توهج سلس وبطيء بين الأخضر والأزرق */
        .wave-name {
            font-size: 28px;
            font-weight: 900;
            display: block;
            margin-bottom: 25px;
            animation: smoothGlow 6s linear infinite;
            text-shadow: 0 0 15px currentColor;
        }

        @keyframes smoothGlow {
            0% { color: #00ff41; }   /* أخضر فاتح */
            33% { color: #0080ff; }  /* أزرق */
            66% { color: #004d1a; }  /* أخضر غامق */
            100% { color: #00ff41; }
        }

        .btn {
            display: block;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 20px #00ff41; }
        .tiktok { border-color: #ff0050; color: #ff0050; }

        #status-text { font-size: 12px; color: #666; margin-bottom: 10px; }
        #bot-link { display: none; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>
    <div class="card">
        <div class="wave-name">ABDO TOP1</div>
        <div id="status-text">نظام الحماية: بانتظار الإشارة...</div>

        <a href="https://www.tiktok.com/@kaniki953" target="_blank" class="btn tiktok" onclick="checkWithPython()">
            اضغط للاشتراك في تيك توك
        </a>

        <div id="bot-link">
            <a href="https://t.me/AllFileFFOB53bot" class="btn">تم التحقق ✅ دخول البوت</a>
        </div>
    </div>

    <script>
        // كود النجوم المتحركة (Canvas)
        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d");
        let stars = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<200; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, z: Math.random()*canvas.width});
        }
        function draw() {
            ctx.fillStyle = "black"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                let x = (s.x - canvas.width/2) * (canvas.width/s.z) + canvas.width/2;
                let y = (s.y - canvas.height/2) * (canvas.width/s.z) + canvas.height/2;
                ctx.beginPath(); ctx.arc(x,y,1.2*(canvas.width/s.z),0,Math.PI*2); ctx.fill();
                s.z -= 2; if(s.z <= 0) s.z = canvas.width;
            });
            requestAnimationFrame(draw);
        }
        init(); draw();

        // الربط اللحظي مع البايثون
        function checkWithPython() {
            const status = document.getElementById('status-text');
            status.innerHTML = "⏳ جاري الاستجابة من الأداة...";
            status.style.color = "#00ffff";

            // الاتصال بالسيرفر الخاص بك
            fetch('/verify_now')
            .then(response => response.json())
            .then(data => {
                if(data.status === "verified") {
                    // في جزء من الثانية يتم التنفيذ
                    setTimeout(() => {
                        status.innerHTML = "تم ✅";
                        status.style.color = "#00ff41";
                        document.getElementById('bot-link').style.display = "block";
                    }, 600); 
                }
            })
            .catch(err => {
                status.innerHTML = "خطأ في الاتصال بالأداة!";
                status.style.color = "#ff0050";
            });
        }
    </script>
</body>
</html>
