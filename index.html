<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <style>
        :root { --spacing: 1.05mm; }

        body {

            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: -1; }

        .card {
            background: rgba(5, 5, 5, 0.9);
            border: 1px solid rgba(0, 255, 65, 0.3);
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.1);
            width: 320px;
            backdrop-filter: blur(15px);
            z-index: 10;
        }

        /* توهج الاسم: انتقال سلس وبطيء بين الأخضر والأزرق والألوان الأساسية */
        .wave-name {
            font-size: 26px;
            font-weight: 900;
            white-space: nowrap;
            display: block;
            margin-bottom: 30px;
            animation: waveMotion 3s ease-in-out infinite, smoothGlow 4s linear infinite;
            text-shadow: 0 0 20px currentColor;
        }

        @keyframes waveMotion {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes smoothGlow {
            0% { color: #00ff41; }      /* أخضر فاتح */
            25% { color: #0080ff; }     /* أزرق فاتح */
            50% { color: #000080; }     /* أزرق غامق */
            75% { color: #004d1a; }     /* أخضر غامق */
            100% { color: #00ff41; }    /* العودة للأخضر */
        }

        .btn {
            display: block;
            padding: 14px;
            margin: var(--spacing);
            border: 1px solid #00ff41;
            color: #00ff41;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
            transition: 0.4s;
            background: rgba(0, 255, 65, 0.02);
            text-transform: uppercase;
        }

        .btn:hover { background: #00ff41; color: #000; box-shadow: 0 0 30px #00ff41; }

        .tiktok-style { border-color: #ff0050; color: #ff0050; }
        .tiktok-style:hover { background: #ff0050; color: #fff; box-shadow: 0 0 30px #ff0050; }

        #verify-log {
            font-size: 11px;
            color: #888;
            margin-bottom: 20px;
            min-height: 15px;
            font-weight: bold;
        }

        #bot-access { display: none; transform: scale(0.9); transition: 0.5s; }
        .show-bot { display: block !important; transform: scale(1) !important; }
    </style>
</head>

        const canvas = document.getElementById("starfield");
        const ctx = canvas.getContext("2d");
        let stars = [];
        const numStars = 300;

        function initStars() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = [];
            for (let i = 0; i < numStars; i++) {
                stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, z: Math.random() * canvas.width, size: 1.2 });
            }
        }

        function drawStars() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            for (let i = 0; i < numStars; i++) {
                let star = stars[i];
                let x = (star.x - canvas.width / 2) * (canvas.width / star.z) + canvas.width / 2;
                let y = (star.y - canvas.height / 2) * (canvas.width / star.z) + canvas.height / 2;
                ctx.beginPath(); ctx.arc(x, y, star.size * (canvas.width / star.z), 0, Math.PI * 2); ctx.fill();
                star.z -= 2; if (star.z <= 0) star.z = canvas.width;
            }
            requestAnimationFrame(drawStars);
        }
        initStars(); drawStars();
